<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lonely Dungeon Master</title>
  <!-- Works without a build step: three.js comes from the CDN. `npm run build` bundles it for offline tables. -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
    canvas { display: block; }
    #narration {
      position: fixed; left: 50%; bottom: 4vh; transform: translate(-50%, 12px);
      max-width: 70vw; padding: 14px 26px; border-radius: 14px;
      font: 500 clamp(18px, 2.2vw, 34px)/1.35 Georgia, "Times New Roman", serif;
      color: #f4e9d1; text-align: center;
      background: rgba(10, 8, 6, .72); opacity: 0;
      transition: opacity .5s cubic-bezier(.2,.8,.2,1), transform .5s cubic-bezier(.2,.8,.2,1);
      pointer-events: none;
    }
    #narration.show { opacity: 1; transform: translate(-50%, 0); }
    #status {
      position: fixed; top: 2vh; right: 2vw; font: 14px/1.2 system-ui, sans-serif;
      color: #8fa4c8; opacity: .0; transition: opacity .3s;
    }
    #status.show { opacity: .85; }
    #help {
      position: fixed; top: 2vh; left: 2vw; font: 14px/1.5 system-ui, sans-serif; color: #6c7a93;
      transition: opacity 1s; pointer-events: none;
    }
    #help.hide { opacity: 0; }
  </style>
</head>
<body>
  <div id="narration"></div>
  <div id="status"></div>
  <div id="help">F fullscreen &middot; Space talk to the DM &middot; G grid on/off</div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
